<title>Foam — your private archive</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f5;color:#1c2128;font:18px/1.6 system-ui,sans-serif}main{max-width:760px;margin:10vh auto;padding:40px}small{color:#52616e;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(36px,6vw,58px);letter-spacing:-.045em;line-height:1.1;margin:24px 0}p{color:#52616e}a{display:inline-block;padding:16px 28px;background:#1c2128;color:#fff;border-radius:32px;text-decoration:none;font-weight:600;margin-top:20px}a:focus-visible{outline:3px solid #285dcc;outline-offset:5px}
</style>
</head>
<body>
<main>
<small>Foam · Private archive</small>
<h1>Your saved pages have moved.</h1>
<p>The archive now has email sign-in. You’ll be taken to its new address.</p>
<a href="https://foam-archive.stevendavidlewis80.workers.dev/">Open the private archive ↗</a>
</main>
<script>
(async () => {
  const archiveScope = '/NEWFOAMHOME/archive-sept-2026/pages/';
  const cachePrefix = 'foam-media-v1:' + archiveScope + ':';
  const cleanup = async () => {
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.filter(registration => {
        const scope = new URL(registration.scope);
        return scope.origin === location.origin && scope.pathname === archiveScope;
      }).map(registration => registration.unregister()));
    }
    if ('caches' in window) {
      await Promise.all((await caches.keys()).filter(name => name.startsWith(cachePrefix)).map(name => caches.delete(name)));
    }
  };
  await Promise.race([cleanup().catch(() => {}), new Promise(resolve => setTimeout(resolve, 500))]);
  location.replace('https://foam-archive.stevendavidlewis80.workers.dev/');
})();
</script>
</body>
