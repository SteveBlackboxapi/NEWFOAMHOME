<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Resolve appearance before the app paints, including on direct links.
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("foam-site-theme");
        } catch {}
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>
    <title>Foam: get back to the part you're actually good at</title>
    <meta
      name="description"
      content="The pitch platform for talent managers, built around how deals actually get done."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
