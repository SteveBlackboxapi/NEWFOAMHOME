name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [talent-library-saved]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply saved website image replacements
        run: node scripts/publish-library-images.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Always resolve and pin the newest saved catalogue. A delayed dispatch
        # cannot roll newer replacements back to the event's older revision.
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      # SPA fallback: 404.html for unknown paths, plus real route folders so
      # /kit-story and siblings return 200 on GitHub Pages (basename intact).
      - run: |
          cp dist/index.html dist/404.html
          for route in kit-story chrome-story managers brands features about creators data-trust updates demo home-film-preview lab/inspo; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
