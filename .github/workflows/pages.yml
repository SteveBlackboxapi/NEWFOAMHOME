name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [talent-library-saved]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check private archive access rules
        run: |
          npm ci --prefix workers/archive
          npm test --prefix workers/archive
      - name: Check media delivery and publishing
        run: |
          npx tsc --noEmit
          node --test scripts/test-*.mjs workers/talent-lab/worker.test.mjs
      - name: Apply saved website image replacements
        run: node scripts/publish-library-images.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Always resolve and pin the newest saved catalogue. A delayed dispatch
        # cannot roll newer replacements back to the event's older revision.
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          # Optional when moving to a new public domain; includes any path prefix.
          SITE_URL: ${{ vars.SITE_URL }}
      # The build emits route-specific metadata, sitemap and the SPA fallback.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
